[Mod]
Id = ShadowstepConfigurable
Name = Shadowstep - Configurable
Author = oOCamilleOo
Version = 0.2.0-dev
Description = Adjust Shadowstep distances and travel speed.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Apply the configured Shadowstep overrides. Off restores values still owned by this mod.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.horizontalMetres]
Id = horizontalMetres
Type = slider
Label = Horizontal distance (m)
Description = Horizontal Shadowstep range in metres.
Group = Distance
Minimum = 1
Maximum = 50
Step = 0.5
Decimals = 1
Default = 18
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = horizontalMetres

[Setting.upMetres]
Id = upMetres
Type = slider
Label = Upward distance (m)
Description = Upward Shadowstep range in metres.
Group = Distance
Minimum = 1
Maximum = 50
Step = 0.5
Decimals = 1
Default = 18
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = upMetres

[Setting.downMetres]
Id = downMetres
Type = slider
Label = Downward distance (m)
Description = Downward Shadowstep range in metres.
Group = Distance
Minimum = 1
Maximum = 50
Step = 0.5
Decimals = 1
Default = 18
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = downMetres

[Setting.speed]
Id = speed
Type = slider
Label = Travel speed (m/s)
Description = Shadowstep travel speed in metres per second.
Group = Movement
Minimum = 1
Maximum = 50
Step = 0.5
Decimals = 1
Default = 15
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = speed

[Setting.logLevel]
Id = logLevel
Type = picker
Label = Logging
Description = Cumulative diagnostic detail. Warning by default; Debug includes tracing and timings. Off silences all mod output.
Group = Diagnostics
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
